# Render Blueprint — deploys backend (FastAPI) and frontend (static React
# build) as two services. See: https://render.com/docs/blueprint-spec
#
# All secrets/config are left unset here ("sync: false") — set their real
# values in the Render dashboard, never in this file.

services:
  # ------------------------------------------------------------------
  # Backend — FastAPI
  # ------------------------------------------------------------------
  - type: web
    name: ai-voice-crm-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: AI Voice Calling CRM
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: uploads

  # ------------------------------------------------------------------
  # Frontend — React (Vite static build)
  # ------------------------------------------------------------------
  - type: web
    name: ai-voice-crm-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
